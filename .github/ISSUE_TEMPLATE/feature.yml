name: 기능 제안
description: 하나의 사용자 문제와 완료 조건을 제안합니다.
title: "[기능] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 사용자 문제
      description: 누가 어떤 상황에서 무엇을 할 수 없는지 적어 주세요.
      placeholder: 사용자는 검색 결과의 근거를 확인할 수 없습니다.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 완료 조건
      description: 해결 여부를 확인할 수 있는 동작을 적어 주세요.
      placeholder: 검색 결과에서 근거 문서를 열 수 있습니다.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 확인 방법
      description: 필요한 테스트, 화면 확인 또는 품질 평가를 간단히 적어 주세요.
    validations:
      required: false
