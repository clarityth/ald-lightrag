name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test_comparison.cjs scripts/test_workspace.cjs
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s lightrag_app -p 'test_*.py' -v
      - run: python scripts/check_public_files.py
      - run: python evaluation/summarize.py
      - run: python evaluation/check007.py --implementation-ref 2803825b31fc3768ea0818bc0aa11b108324e471
